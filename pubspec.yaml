name: fmchat
description: File Manager + Chat
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2
  file_picker: ^13.1.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  receive_sharing_intent: any
  record: any
  audioplayers: ^6.5.1
  firebase_core: any
  firebase_messaging: any
flutter:
  uses-material-design: true