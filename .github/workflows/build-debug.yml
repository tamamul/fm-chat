name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Buat folder android
        run: |
          flutter create --org id.marsa9 --project-name fmchat --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
      - name: Set compileSdk 36
    run: |
      if [ -f android/app/build.gradle.kts ]; then
        sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' android/app/build.gradle.kts
      elif [ -f android/app/build.gradle ]; then
        sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 36/; s/compileSdk [0-9]+/compileSdk 36/' android/app/build.gradle
      else
        echo "File Gradle Android tidak ditemukan"
        exit 1
      fi
      - name: Izin internet
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $f
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: fmchat-apk
          path: build/app/outputs/flutter-apk/*.apk
