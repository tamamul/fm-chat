  name: Build APK

  on:
  workflow_dispatch:

  jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder android
        run: |
          flutter create --org id.marsa9 --project-name fmchat --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Atur Android Gradle dan compileSdk
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("android/settings.gradle.kts")
          s = p.read_text()
          s, n = re.subn(
              r'(id\(["\']com\.android\.application["\']\)\s+version\s+["\'])[^"\']+',
              r'\g<1>9.1.1',
              s,
              count=1
          )
          if n == 0:
              raise SystemExit("Versi AGP tidak ditemukan di settings.gradle.kts")
          p.write_text(s)

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s, n = re.subn(
              r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)',
              'compileSdk = 37',
              s,
              count=1
          )
          if n == 0:
              raise SystemExit("compileSdk tidak ditemukan")
          p.write_text(s)

          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          s = p.read_text()
          s, n = re.subn(
              r'gradle-[0-9.]+-(?:all|bin)\.zip',
              'gradle-9.3.1-bin.zip',
              s,
              count=1
          )
          if n == 0:
              raise SystemExit("Gradle wrapper URL tidak ditemukan")
          p.write_text(s)

          print("AGP 9.1.1, Gradle 9.3.1, compileSdk 37")
          PY

      - name: Install Android SDK Platform 37
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-37.0"

      - name: Atur manifest
      
      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          import re

          p = 'android/app/src/main/AndroidManifest.xml'

          with open(p, encoding='utf-8') as f:
              s = f.read()

          if '<application' not in s:
              raise SystemExit("Tag <application> tidak ditemukan")

          permissions = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
          ]

          for permission in permissions:
              if permission not in s:
                  tag = f'<uses-permission android:name="{permission}"/>'
                  s = s.replace('<application', tag + '\n    <application', 1)

          s = s.replace(
              'android:launchMode="singleTop"',
              'android:launchMode="singleTask"'
          )

          with open('android-intent-filters.xml', encoding='utf-8') as f:
              filters = f.read().strip()

          if not filters:
              raise SystemExit("File intent filters kosong")

          if '</activity>' not in s:
              raise SystemExit("Tag </activity> tidak ditemukan")

          if filters not in s:
              s = s.replace(
                  '</activity>',
                  filters + '\n        </activity>',
                  1
              )

          with open(p, 'w', encoding='utf-8') as f:
              f.write(s)

          print("AndroidManifest.xml berhasil diperbarui")
          PY


      - name: Ambil dependensi Flutter
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: fmchat-apk
          path: build/app/outputs/flutter-apk/*.apk
