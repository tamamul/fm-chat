
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor

      - name: Get Dependencies
        run: flutter pub get




      - name: Buat folder android
        run: |
          if [ ! -d android ]; then
            flutter create \
              --org id.marsa9 \
              --project-name fmchat \
              --platforms android \
              /tmp/scaffold

            cp -r /tmp/scaffold/android ./android
          fi

          ls -la android/app/src/main/

      - name: Salin konfigurasi Firebase
        run: cp firebase-strings.xml android/app/src/main/res/values/firebase_config.xml
      - name: Atur compileSdk 37
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          old = "compileSdk = flutter.compileSdkVersion"
          new = "compileSdk = 37"

          if old not in s:
              raise SystemExit("Baris compileSdk tidak ditemukan")

          p.write_text(s.replace(old, new, 1))
          print("compileSdk berhasil diubah menjadi 37")
          PY

            
      - name: Pasang ikon dan MainActivity
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp ic_notif.xml android/app/src/main/res/drawable/ic_notif.xml
          cp MainActivity.kt "$(find android -name MainActivity.kt | head -n 1)"

      - name: Install Android SDK Platform 37
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager 2>/dev/null | head -n 1)"
          "$SDKMANAGER" "platforms;android-37.0"


      - name: Atur manifest
        run: |
          set -e

          echo "Memeriksa struktur folder Android..."
          find android -name AndroidManifest.xml -type f

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          candidates = list(
              Path('android').rglob('AndroidManifest.xml')
          )

          p = next(
              (
                  f for f in candidates
                  if f.as_posix().endswith(
                      '/src/main/AndroidManifest.xml'
                  )
              ),
              None
          )

          if p is None:
              print("Manifest tidak ditemukan.")
              print("File Android yang tersedia:")
              for f in Path('android').rglob('*'):
                  if f.is_file():
                      print(f)
              raise SystemExit(1)

          print(f"Menggunakan manifest: {p}")
          s = p.read_text(encoding='utf-8')

          if not re.search(r'<application(?:\s|>)', s):
              raise SystemExit("Tag <application> tidak ditemukan")

          permissions = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
              'android.permission.POST_NOTIFICATIONS',
          ]

          for permission in permissions:
              if not re.search(
                  r'<uses-permission\b[^>]*android:name=["\']'
                  + re.escape(permission)
                  + r'["\']',
                  s
              ):
                  tag = (
                      f'<uses-permission '
                      f'android:name="{permission}"/>'
                  )
                  s = re.sub(
                      r'<application(?=[\s>])',
                      tag + '\n    <application',
                      s,
                      count=1
                  )
          queries = (
              '<queries>\n'
              '        <intent><action android:name="android.media.action.IMAGE_CAPTURE"/></intent>\n'
              '        <intent><action android:name="android.media.action.VIDEO_CAPTURE"/></intent>\n'
              '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n'
              '    </queries>\n    '
          )
          if '<queries>' not in s:
              s = re.sub(r'<application(?=[\s>])', lambda m: queries + '<application', s, count=1)
              
          s = s.replace(
              'android:launchMode="singleTop"',
              'android:launchMode="singleTask"'
          )

          filters_path = Path('android-intent-filters.xml')

          if not filters_path.exists():
              raise SystemExit(
                  "android-intent-filters.xml tidak ditemukan"
              )

          filters = filters_path.read_text(
              encoding='utf-8'
          ).strip()

          if filters and filters not in s:
              if '</activity>' not in s:
                  raise SystemExit("</activity> tidak ditemukan")
              s = s.replace(
                  '</activity>',
                  filters + '\n        </activity>',
                  1
              )
              
          meta = (
              '    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" '
              'android:resource="@drawable/ic_notif" />\n'
              '    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" '
              'android:value="pesan" />\n'
          )
          if 'default_notification_icon' not in s:
              s = s.replace('</application>', meta + '</application>', 1)    
          ET.fromstring(s)
          p.write_text(s, encoding='utf-8')

          print("Manifest valid.")
          print("Izin INTERNET dan RECORD_AUDIO tersedia.")
          print("Intent filter diperiksa.")
          PY



      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fmchat-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
