
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor

      - name: Get Dependencies
        run: flutter pub get

      
      - name: Atur manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/AndroidManifest.xml')

          if not p.exists():
              raise SystemExit(f"Manifest tidak ditemukan: {p}")

          s = p.read_text(encoding='utf-8')

          if '<application' not in s:
              raise SystemExit("Tag <application> tidak ditemukan")

          permissions = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
          ]

          for permission in permissions:
              if permission not in s:
                  tag = f'<uses-permission android:name="{permission}"/>'
                  s = s.replace(
                      '<application',
                      tag + '\n    <application',
                      1
                  )

          s = s.replace(
              'android:launchMode="singleTop"',
              'android:launchMode="singleTask"'
          )

          filters_path = Path('android-intent-filters.xml')

          if not filters_path.exists():
              raise SystemExit(
                  f"File intent filter tidak ditemukan: {filters_path}"
              )

          filters = filters_path.read_text(
              encoding='utf-8'
          ).strip()

          if '</activity>' not in s:
              raise SystemExit("Tag </activity> tidak ditemukan")

          if filters and filters not in s:
              s = s.replace(
                  '</activity>',
                  filters + '\n        </activity>',
                  1
              )

          p.write_text(s, encoding='utf-8')

          import xml.etree.ElementTree as ET
          ET.parse(p)

          print("Manifest valid.")
          print("Izin INTERNET dan RECORD_AUDIO tersedia.")
          print("Intent filter diperiksa.")
          PY


      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fmchat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
