name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Buat folder android
        run: |
          flutter create --org id.marsa9 --project-name fmchat --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          find android -maxdepth 3 -type f
          grep -R -n 'compileSdk' android
      
      - name: Siapkan Android SDK 37
        run: |
          sdkmanager "platforms;android-37"
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("android/settings.gradle.kts")
          s = p.read_text()
          s = re.sub(
              r'(id\(["\']com\.android\.application["\']\)\s+version\s+["\'])[^"\']+',
              r'\g<1>9.1.1',
              s
          )
          p.write_text(s)

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 37"
          )
          p.write_text(s)

          print("Konfigurasi Android SDK 37 selesai.")
          PY


      - name: Atur manifest (izin internet dan menu Bagikan)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = s.replace('android:launchMode="singleTop"', 'android:launchMode="singleTask"')
          filters = open('android-intent-filters.xml', encoding='utf-8').read()
          assert '</activity>' in s
          s = s.replace('</activity>', filters + '\n        </activity>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: fmchat-apk
          path: build/app/outputs/flutter-apk/*.apk