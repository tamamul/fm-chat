
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path(
              'android/app/src/main/AndroidManifest.xml'
          )
          filters_file = Path('android-intent-filters.xml')

          if not manifest.exists():
              raise SystemExit(
                  f"Manifest tidak ditemukan: {manifest}"
              )

          if not filters_file.exists():
              raise SystemExit(
                  f"File tidak ditemukan: {filters_file}"
              )

          s = manifest.read_text(encoding='utf-8')
          filters = filters_file.read_text(
              encoding='utf-8'
          ).strip()

          if not re.search(r'<application(?:\s|>)', s):
              raise SystemExit(
                  "Tag <application> tidak ditemukan"
              )

          permissions = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
          ]

          for permission in permissions:
              if not re.search(
                  r'<uses-permission\b[^>]*'
                  r'android:name=["\']'
                  + re.escape(permission)
                  + r'["\']',
                  s
              ):
                  tag = (
                      f'<uses-permission '
                      f'android:name="{permission}"/>'
                  )
                  s = re.sub(
                      r'<application(?=[\s>])',
                      tag + '\n    <application',
                      s,
                      count=1
                  )

          s = s.replace(
              'android:launchMode="singleTop"',
              'android:launchMode="singleTask"'
          )

          if filters:
              if '</activity>' not in s:
                  raise SystemExit(
                      "Tag </activity> tidak ditemukan"
                  )

              if filters not in s:
                  s = s.replace(
                      '</activity>',
                      filters + '\n        </activity>',
                      1
                  )

          manifest.write_text(s, encoding='utf-8')

          print("Manifest berhasil dikonfigurasi.")
          print("Izin INTERNET dan RECORD_AUDIO diperiksa.")
          PY

      - name: Validate Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = 'android/app/src/main/AndroidManifest.xml'
          ET.parse(path)
          print("AndroidManifest.xml valid.")
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fmchat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
