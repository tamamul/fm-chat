name: Build APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK 36
    run: sdkmanager "platforms;android-36"

  - name: Buat folder Android
    run: |
      flutter create \
        --org id.marsa9 \
        --project-name fmchat \
        --platforms android \
        /tmp/scaffold
      cp -r /tmp/scaffold/android ./android

  - name: Set compileSdk 36
    run: |
      if [ -f android/app/build.gradle.kts ]; then
        sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' android/app/build.gradle.kts
      elif [ -f android/app/build.gradle ]; then
        sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 36/; s/compileSdk [0-9]+/compileSdk 36/' android/app/build.gradle
      else
        echo "File Gradle Android tidak ditemukan"
        exit 1
      fi

  - name: Izin internet
    run: |
      f=android/app/src/main/AndroidManifest.xml
      grep -q 'android.permission.INTERNET' "$f" || \
        sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$f"

  - name: Ambil dependency
    run: flutter pub get

  - name: Build APK
    run: flutter build apk --release --split-per-abi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: fmchat-apk
      path: build/app/outputs/flutter-apk/*.apk